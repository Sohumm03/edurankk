server.port=8090

spring.application.name=edurank-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/edurankdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Security / Session Settings
server.servlet.session.timeout=480m
server.servlet.session.cookie.same-site=lax

# Logging
logging.level.com.edurank=INFO
logging.level.org.springframework.web=INFO
